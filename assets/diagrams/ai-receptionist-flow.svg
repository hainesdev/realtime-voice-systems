<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AI receptionist call flow</title>
  <desc id="desc">An inbound call rings a human, then moves through notice and opt-out to an AI receptionist or voicemail fallback.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#44506a}.box{stroke:#25314d;stroke-width:2;rx:14}.arrow{stroke:#52627f;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52627f"/></marker></defs>
  <rect width="1200" height="360" fill="#f7f9fc"/>
  <text x="60" y="50" font-size="27" font-weight="700">AI receptionist: human-first call handling</text>
  <g transform="translate(55,120)">
    <rect class="box" width="180" height="95" fill="#e8f0ff"/><text class="label" x="90" y="39" text-anchor="middle">Inbound call</text><text class="small" x="90" y="64" text-anchor="middle">PBX routing</text>
    <rect class="box" x="245" width="180" height="95" fill="#eaf8f0"/><text class="label" x="335" y="39" text-anchor="middle">Human ring</text><text class="small" x="335" y="64" text-anchor="middle">defined answer window</text>
    <rect class="box" x="490" width="190" height="95" fill="#fff4d8"/><text class="label" x="585" y="39" text-anchor="middle">Notice + choice</text><text class="small" x="585" y="64" text-anchor="middle">AI / recording disclosure</text>
    <rect class="box" x="750" width="190" height="95" fill="#eee9ff"/><text class="label" x="845" y="39" text-anchor="middle">AI receptionist</text><text class="small" x="845" y="64" text-anchor="middle">ARI, RTP, Realtime</text>
    <rect class="box" x="1000" width="145" height="95" fill="#f1f3f7"/><text class="label" x="1072" y="39" text-anchor="middle">Voicemail</text><text class="small" x="1072" y="64" text-anchor="middle">safe fallback</text>
    <path class="arrow" d="M180 48H240"/><path class="arrow" d="M425 48H485"/><path class="arrow" d="M680 48H745"/><path class="arrow" d="M940 48H995"/>
    <path class="arrow" d="M585 95V170H1072V100"/><text class="small" x="777" y="160">caller opts out or AI is unavailable</text>
  </g>
  <text class="small" x="60" y="315">The flow resolves callers to a person, disclosed automation, or voicemail—never a silent or partial session.</text>
</svg>
